name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Each push to main gets its own group and is never cancelled, so every merge keeps its own run.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # check-pr-size.sh diffs against origin/<base>, so the base branch history is needed.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: bun ci

      - name: Biome
        run: bunx biome ci --error-on-warnings .

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: PR size
        if: github.event_name == 'pull_request'
        run: bash scripts/check-pr-size.sh origin/${{ github.base_ref }}

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun ci

      # Applies every migration, so invalid SQL fails here. Names must match `supabase start --help`:
      # an unknown name only prints a warning and starts the service anyway.
      - name: Supabase start
        run: bunx supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: pgTAP
        run: bunx supabase test db
